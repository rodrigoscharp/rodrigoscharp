<svg viewBox="0 0 180 56" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Instagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2230"/>
      <stop offset="1" stop-color="#10141c"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="3" y="3" width="174" height="50" rx="14" fill="url(#bg)" stroke="#3d4452" stroke-width="1.5" filter="url(#sh)">
    <animate attributeName="stroke" values="#3d4452;#d6249f;#3d4452" dur="4s" repeatCount="indefinite"/>
  </rect>
  <defs>
    <linearGradient id="ig" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#fd5949"/>
      <stop offset="0.5" stop-color="#d6249f"/>
      <stop offset="1" stop-color="#285AEB"/>
    </linearGradient>
  </defs>
  <rect x="18" y="16" width="24" height="24" rx="7" fill="none" stroke="url(#ig)" stroke-width="2.4"/>
  <circle cx="30" cy="28" r="5.4" fill="none" stroke="url(#ig)" stroke-width="2.4"/>
  <circle cx="36.4" cy="21.6" r="1.7" fill="url(#ig)"/>
  <text x="58" y="34" font-size="15" fill="#c9d1d9">Instagram</text>
</svg>