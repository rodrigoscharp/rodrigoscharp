<svg viewBox="0 0 180 56" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Instagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161616"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="3" y="3" width="174" height="50" rx="14" fill="url(#bg)" stroke="#3a3a3a" stroke-width="1.5" filter="url(#sh)">
    <animate attributeName="stroke" values="#3a3a3a;#e4e4e4;#3a3a3a" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="18" y="16" width="24" height="24" rx="7" fill="none" stroke="#f2f2f2" stroke-width="2.4"/>
  <circle cx="30" cy="28" r="5.4" fill="none" stroke="#f2f2f2" stroke-width="2.4"/>
  <circle cx="36.4" cy="21.6" r="1.7" fill="#f2f2f2"/>
  <text x="58" y="34" font-size="15" fill="#e4e4e4">Instagram</text>
</svg>